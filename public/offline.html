<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çevrimdışı - Bağlantı Koptu</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f9f9f9;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            padding: 2rem;
            max-width: 400px;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: #654321;
        }
        p {
            color: #666;
            margin-bottom: 2rem;
            line-height: 1.5;
        }
        button {
            background-color: #654321;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
        button:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Bağlantı Koptu</h1>
        <p>Görünüşe göre internet bağlantınızda bir sorun var. Lütfen ağınızı kontrol edip tekrar deneyin.</p>
        <button onclick="window.location.reload()">Tekrar Dene</button>
    </div>
</body>
</html>
